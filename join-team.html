<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join SoulCure</title>
  <link rel="stylesheet" href="index.css">
  
  <style>
    body {
      background-color: #e8f6f3;
      font-family: Arial, sans-serif;
      height: 100vh;
      margin: 0;
      display:flex;
      justify-content:center;
      align-items:center;
     
    }
    .form-container {
      background: #fff;
      width: 32%; 
      padding: 22px;
      border-radius: 11px;
      
     
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
    }
    .form-container h2{
      text-align:center;
      color:#0277b6;
      margin-bottom:18px;
    }
    label{
      font-size:13.9px;
      margin-bottom:7px;
      color:#004e41;
    }
    input, textarea{
      padding:9px;
      margin-bottom:14px;
      border-radius:7px;
      border:1.2px solid #0277b6;
      font-size:15.5px;
      outline:none;
    }
    button{
      background:#0277b6;
      color:white;
      border:none;
      padding:13px;
      border-radius:7px;
      cursor:pointer;
      font-size:15.2px;
      
    }
    button:hover {
      background:#016089;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <h1 class="logo">SoulCure</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="Home.html">About Us</a></li>
        <li><a href="#">Community</a></li>
        <li><a href="join-team.html">Join our Team</a></li>
        <li><a href="#">Services</a></li>
        <li><a class="enquiry-btn" href="enqiury.html">Enquiry</a></li>
      </ul>
    </nav>
  </header>
  <div class="form-container">
    <h2>Want to Serve : Join SoulCure</h2>
    <form>
      <label for="fullnm">Full Name</label>
      <input type="text" id="fullnm" placeholder="Enter your full name" required>
      <br>
      <label for="usremail">Email Id</label>
      <input type="email" id="usremail" placeholder="Enter your email address" required>
      <br>
      <label for="usrtel">Phone Number</label>
      <input type="tel" id="usrtel" placeholder="Enter phone Number" required>
      <br>
      <label for="msg">Your message</label>
      <textarea id="msg" placeholder="Want to serve as....." rows="4" required></textarea>
      <br>
      <button type="submit">Join Team!</button>
    </form>
  </div>
</body>
</html>
